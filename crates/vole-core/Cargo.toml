[package]
name = "vole-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vole-sys = { path = "../vole-sys" }
rustix = { version = "1", features = ["fs"] }
thiserror = "2"
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
crossbeam-channel = "0.5"
serde_json.workspace = true
jwalk = "0.8"
glob = "0.3"
toml = "0.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"
