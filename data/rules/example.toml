# 示例规则（Phase 4b Task 7 schema 演示）

[[rule]]
id = "chrome-cache"
category = "browser"
label = "Chrome cache"
platform = ["macos"]
paths = [
  "~/Library/Caches/Google/Chrome/*/Cache",
  "~/Library/Caches/Google/Chrome/*/Code Cache",
]
impact = "Chrome 将在下次启动时重建缓存，不影响登录状态"
disabled = false
last_verified = "2026-07"

[rule.strategy]
kind = "all"

[[rule]]
id = "xcode-derived-data"
category = "developer"
label = "Xcode DerivedData"
platform = ["macos"]
paths = ["~/Library/Developer/Xcode/DerivedData/*"]
impact = "删除全部 DerivedData 项目子目录（构建产物与索引），下次构建自动重建；Xcode 运行时跳过"
disabled = false
last_verified = "2026-10"

[rule.strategy]
kind = "all"

[rule.guards]
not_running = ["Xcode"]
