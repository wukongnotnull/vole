id = "brave-library-cache"
category = "user-devtools"
label = "Brave library cache"
platform = ["macos"]
paths = ["~/Library/Caches/BraveSoftware/Brave-Browser/*"]
impact = "Application cache/logs; safe to rebuild"
disabled = false
last_verified = "2026-07"

[rule.strategy]
kind = "all"

[[rule]]
id = "chrome-profile-app-cache"
category = "user-devtools"
label = "Chrome profile app cache"
platform = ["macos"]
paths = ["~/Library/Application Support/Google/Chrome/*/Application Cache/*"]
impact = "Application cache/logs; safe to rebuild"
disabled = false
last_verified = "2026-07"

[rule.strategy]
kind = "all"

