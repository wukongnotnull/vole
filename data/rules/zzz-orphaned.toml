# Orphaned app data — MUST load last (filename sorts after all other rule files).
# NEVER expand to Containers / Group Containers / LaunchAgents / Application Scripts.

[[rule]]
id = "orphaned-app-data"
category = "orphaned"
label = "Orphaned app data"
platform = ["macos"]
paths = [
  "~/Library/Caches/*",
  "~/Library/Logs/*",
  "~/Library/Saved Application State/*",
]
impact = "卸载后残留：Caches/Logs/Saved State（≥30 天）与 Claude Desktop workspace VM bundle（≥7 天，MOLE_CLAUDE_VM_ORPHAN_AGE_DAYS）"
disabled = false
last_verified = "2026-08"

[rule.strategy]
kind = "custom"
handler = "orphaned_app_data"
