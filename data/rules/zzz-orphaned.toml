# Orphaned app data — MUST load last (filename sorts after all other rule files).
# NEVER expand to Containers / Group Containers / LaunchAgents / Application Scripts.
# (orphaned-container-stubs below is a hardcoded-allowlist carve-out, NOT an
#  expansion of the blanket Containers protection.)

[[rule]]
id = "orphaned-app-data"
category = "orphaned"
label = "Orphaned app data"
platform = ["macos"]
paths = [
  "~/Library/Caches/*",
  "~/Library/Logs/*",
  "~/Library/Saved Application State/*",
]
impact = "卸载后残留：Caches/Logs/Saved State（≥30 天）与 Claude Desktop workspace VM bundle（≥7 天，MOLE_CLAUDE_VM_ORPHAN_AGE_DAYS）"
disabled = false
last_verified = "2026-08"

[rule.strategy]
kind = "custom"
handler = "orphaned_app_data"

[[rule]]
id = "orphaned-container-stubs"
category = "orphaned"
label = "Orphaned container stubs"
platform = ["macos"]
paths = ["~/Library/Containers"]
impact = "卸载后残留的沙盒容器 stub（硬编码 CleanMyMac allowlist；仅『目录内只剩 containermanagerd metadata plist』的空壳）；apply 用专用 unlink+rmdir 删除，不进废纸篓，--permanent 不适用"
disabled = false
last_verified = "2026-08"

[rule.strategy]
kind = "custom"
handler = "orphaned_container_stubs"

[[rule]]
id = "orphaned-system-services"
category = "orphaned"
label = "Orphaned system services"
platform = ["macos"]
paths = [
  "/Library/LaunchDaemons",
  "/Library/LaunchAgents",
  "/Library/PrivilegedHelperTools",
]
impact = "发现 /Library LaunchDaemons、LaunchAgents、PrivilegedHelperTools 可读子集中的 orphan；无 sudo；apply 硬跳过 NeedsPrivilege（发现优先）——完整清理请用 Mole"
disabled = false
last_verified = "2026-08"

[rule.strategy]
kind = "custom"
handler = "orphaned_system_services"
